name: mt5-test

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WINEPREFIX: /home/runner/.mt5
      WINEDEBUG: "-all"
      WINEDLLOVERRIDES: "mscoree,mshtml="
      DISPLAY: ":99"
    steps:
      - uses: actions/checkout@v4

      - name: Install Wine (WineHQ stable) and Xvfb
        run: |
          sudo dpkg --add-architecture i386
          sudo mkdir -pm755 /etc/apt/keyrings
          sudo wget -q -O /etc/apt/keyrings/winehq-archive.key https://dl.winehq.org/wine-builds/winehq.key
          sudo wget -q -NP /etc/apt/sources.list.d/ https://dl.winehq.org/wine-builds/ubuntu/dists/noble/winehq-noble.sources
          sudo apt-get update -q
          sudo apt-get install -y -q --install-recommends winehq-stable xvfb winbind x11-utils
          wine --version

      - name: Start virtual display and create Wine prefix
        run: |
          Xvfb :99 -screen 0 1280x1024x24 &
          sleep 3
          timeout 300 wineboot --init || echo "wineboot timed out or failed: $?"
          timeout 120 winecfg -v win10 || echo "winecfg timed out or failed: $?"
          timeout 60 wine cmd /c echo wine-works || echo "wine cmd failed: $?"

      - name: Install WebView2 runtime and MetaTrader 5
        run: |
          wget -q https://msedge.sf.dl.delivery.mp.microsoft.com/filestreamingservice/files/c1336fd6-a2eb-4669-9b03-949fc70ace0e/MicrosoftEdgeWebview2Setup.exe
          timeout 300 wine MicrosoftEdgeWebview2Setup.exe /silent /install || echo "webview2 installer exit: $?"
          wineserver -w || true
          wget -q https://download.mql5.com/cdn/web/metaquotes.software.corp/mt5/mt5setup.exe
          wine mt5setup.exe /auto > /tmp/mt5setup.log 2>&1 &
          F=""
          for i in $(seq 1 48); do
            F=$(find "$WINEPREFIX/drive_c" -iname terminal64.exe 2>/dev/null | head -1)
            if [ -n "$F" ]; then echo "found: $F"; break; fi
            sleep 5
          done
          echo "--- processes"; ps aux | grep -i -E "mt5|wine|setup" | grep -v grep | cut -c1-180 || true
          echo "--- windows"; xwininfo -root -tree | grep -E '"' | head -30 || true
          echo "--- installer log"; tail -30 /tmp/mt5setup.log || true
          echo "--- metatrader folders"; find "$WINEPREFIX/drive_c" -maxdepth 3 -iname "*metatrader*" 2>/dev/null || true
          if [ -z "$F" ]; then echo "terminal64.exe was NOT installed"; exit 1; fi
          sleep 30
          wineserver -k || true

      - name: Install Windows Python and the MetaTrader5 package (inside Wine)
        run: |
          wget -q https://www.python.org/ftp/python/3.10.11/python-3.10.11-amd64.exe
          timeout 600 wine python-3.10.11-amd64.exe /quiet InstallAllUsers=1 PrependPath=1 Include_test=0 || echo "python installer exit: $?"
          wineserver -w || true
          PYW='C:\Program Files\Python310\python.exe'
          wine "$PYW" --version
          wine "$PYW" -m pip install --upgrade pip
          wine "$PYW" -m pip install MetaTrader5

      - name: Log in to the demo account and read prices
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_PASSWORD: ${{ secrets.MT5_PASSWORD }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
        run: |
          PYW='C:\Program Files\Python310\python.exe'
          TERM=$(find "$WINEPREFIX/drive_c" -iname terminal64.exe | head -1)
          echo "terminal at: $TERM"
          timeout 600 wine "$PYW" mt5/test_mt5.py
