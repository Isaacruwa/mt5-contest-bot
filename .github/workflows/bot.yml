name: bot

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: bot
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Note start time
        run: echo "START=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Restore saved state
        uses: actions/cache/restore@v4
        with:
          path: state.json
          key: state-restore-miss
          restore-keys: |
            state-

      - name: Run the bot for about 4 minutes
        env:
          METAAPI_TOKEN: ${{ secrets.METAAPI_TOKEN }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: python bot.py

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}-${{ github.run_attempt }}

      - name: Chain the next run (keeps the bot always on)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          ELAPSED=$(( $(date +%s) - START ))
          if [ "$ELAPSED" -lt 200 ]; then sleep $(( 200 - ELAPSED )); fi
          gh workflow run bot.yml --ref main
