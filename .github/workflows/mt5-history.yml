name: mt5-history
on: workflow_dispatch

jobs:
  history:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - name: Cache wine prefix
        uses: actions/cache@v4
        with:
          path: ~/.wine-mt5
          key: wine-mt5-v2

      - name: Install Wine, MT5 and Python
        run: bash ci/setup_wine.sh

      - name: Read manual trade history
        env:
          MT5_LOGIN: ${{ secrets.MT5_LOGIN }}
          MT5_SERVER: ${{ secrets.MT5_SERVER }}
          MT5_PASSWORDS: ${{ secrets.MT5_PASSWORDS }}
          MT5_ALT_LOGIN: ${{ secrets.MT5_ALT_LOGIN }}
          MT5_ALT_SERVER: ${{ secrets.MT5_ALT_SERVER }}
          MT5_ALT_PASSWORDS: ${{ secrets.MT5_ALT_PASSWORDS }}
        run: |
          source ci/wine_env.sh
          wine 'C:\Python311\python.exe' history_export.py
